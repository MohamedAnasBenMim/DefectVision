# Single configuration for all experiments (seed, split, models)
seed: 42
data_dir: data/magnetic-tile
image_size: 256

split:            # fractions of PHYSICAL PIECES (groups of 6 lighting conditions), not images
  val: 0.2
  test: 0.2

patchcore:
  layers: [layer2, layer3]
  coreset_ratio: 0.02      # 2% of patches kept in the memory bank
  projection_dim: 128      # random projection to speed up coreset selection
  blur_sigma: 4

unet:
  epochs: 12
  batch_size: 8
  lr: 0.0005
  weight_decay: 0.0001
  good_per_epoch: 120      # good pieces sampled each epoch (class balancing)

operating_point:
  target_recall: 0.95      # threshold set on validation to miss at most 5% of defects
