name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Lint + tests (PyTorch CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Dependencies (CPU-only PyTorch, no CUDA)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[train,dev]"
      - run: ruff check . && ruff format --check .
      - name: ResNet-18 ImageNet weights (ONNX Model Zoo, checksum verified)
        run: dv fetch-weights
      - run: pytest -v

  serving:
    name: Shipped models + API (ONNX Runtime only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install . pytest httpx
      - name: Committed models load and inspect the samples
        run: |
          python - <<'PY'
          import json, cv2
          from defectvision.inference import OnnxInspector
          samples = json.load(open("web/samples/manifest.json"))
          for name in ("patchcore", "unet"):
              insp = OnnxInspector(f"models/{name}.onnx")
              for s in samples:
                  r = insp.inspect(cv2.imread(f"web/samples/{s['file']}", cv2.IMREAD_GRAYSCALE))
                  print(f"{name:9s} {s['label']:9s} score={r.score:.4f} threshold={r.threshold:.4f} -> {r.to_dict()['decision']}")
          PY

  docker:
    name: Docker image + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t defectvision .
      - name: Start container and inspect an image
        run: |
          docker run -d -p 8000:8000 --name dv defectvision
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          f=$(python3 -c "import json;print(json.load(open('web/samples/manifest.json'))[0]['file'])")
          curl -sf -F "file=@web/samples/$f" "localhost:8000/inspect?model=unet&heatmap=false" | tee /dev/stderr | grep -q decision
      - if: failure()
        run: docker logs dv
