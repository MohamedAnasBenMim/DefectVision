[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "defectvision"
version = "0.1.0"
description = "Industrial visual inspection: defect detection and segmentation (unsupervised PatchCore vs supervised U-Net), ONNX export, API."
authors = [{ name = "Mohamed Anas Ben Mim", email = "mohamedanas.benmim@ensi-uma.tn" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pillow>=10",
  "opencv-python-headless>=4.9",
  "onnxruntime>=1.18",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "pyyaml>=6",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
train = ["torch>=2.2", "onnx>=1.16", "scikit-learn>=1.4", "matplotlib>=3.8"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
dv = "defectvision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]
